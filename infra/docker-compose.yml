# Local infrastructure for the Reactive Order & Delivery Platform.
#
#   docker compose up -d                     -> Kafka, Kafka UI, MongoDB, MySQL, Redis, Zipkin
#   docker compose --profile legacy up -d    -> everything above + IBM Db2 (large image, slow first start)
#
# Services run on the host (IDE / mvnw spring-boot:run) and connect via localhost ports.

name: reactive-platform

services:

  # ---------------------------------------------------------------- Kafka (KRaft, no ZooKeeper)
  kafka:
    image: apache/kafka:4.2.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # HOST listener -> apps on your machine (localhost:9092); DOCKER listener -> containers (kafka:29092)
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly by kafka-init
    # No volume on purpose: data survives `stop`/`start`, is wiped by `down`; kafka-init recreates topics.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # One-shot job: creates topics (3 partitions each) + their dead-letter topics, then exits.
  kafka-init:
    image: apache/kafka:4.2.2
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in orders.created orders.status-changed payments.completed payments.failed; do
          for name in "$$t" "$$t.DLT"; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
              --topic "$$name" --partitions 3 --replication-factor 1
          done
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------- MongoDB (single-node replica set)
  # A replica set is required for change streams (Phase 2 SSE price updates) and multi-document transactions.
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # The healthcheck doubles as the replica-set initializer (idempotent).
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------- MySQL (inventory, order, payment schemas)
  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"   # 3307 on the host so it doesn't clash with a locally installed MySQL
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------- Redis (rate limiting, cache, pub/sub)
  redis:
    image: redis:8.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- Zipkin (distributed tracing, Phase 9)
  zipkin:
    image: openzipkin/zipkin:3.6
    container_name: zipkin
    ports:
      - "9411:9411"

  # ---------------------------------------------------------------- IBM Db2 (legacy customer data, Phase 7)
  # Opt-in: ~3 GB image, needs privileged mode, first start takes several minutes.
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    container_name: db2
    profiles: ["legacy"]
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: ${DB2_INSTANCE}
      DB2INST1_PASSWORD: ${DB2_PASSWORD}
      DBNAME: ${DB2_DBNAME}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      IS_OSXFS: "false"
      PERSISTENT_HOME: "true"
      HADR_ENABLED: "false"
      ETCD_ENDPOINT: ""
      ETCD_USERNAME: ""
      ETCD_PASSWORD: ""
    volumes:
      - db2-data:/database
    healthcheck:
      test: ["CMD-SHELL", "su - $${DB2INSTANCE} -c \"db2 connect to $${DBNAME}\" > /dev/null 2>&1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 600s

volumes:
  mongo-data:
  mysql-data:
  db2-data:
