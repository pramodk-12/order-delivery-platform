<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="'Segoe UI', Arial, sans-serif">
  <title>Phase 3 - Inventory Service as built</title>
  <defs>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker>
    <style>
      .t    { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
      .s    { font-size: 12.5px; fill: #37474F; }
      .xs   { font-size: 11px; fill: #546E7A; }
      .code { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 11.5px; fill: #1a1a1a; }
      .c    { text-anchor: middle; }
      .rx   { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 1.5; }
      .neu  { fill: #FAFAFA; stroke: #757575; stroke-width: 1.3; }
      .store{ fill: #ECEFF1; stroke: #546E7A; stroke-width: 1.4; }
      .chip { fill: #FFFFFF; stroke: #90CAF9; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#1a1a1a">Phase 3 · Inventory Service (as built)</text>
  <text x="40" y="72" class="s" font-size="14">WebFlux + R2DBC (MySQL) · reactive transactions · no overselling under concurrency</text>

  <!-- caller -->
  <rect x="40" y="150" width="220" height="90" rx="10" class="neu"/>
  <text x="150" y="178" class="t c">order-service (Phase 4)</text>
  <text x="150" y="198" class="s c">or any REST client</text>
  <text x="150" y="218" class="code c">POST /reservations</text>
  <line x1="262" y1="178" x2="318" y2="178" stroke="#455A64" stroke-width="1.8" marker-start="url(#aGray)" marker-end="url(#aGray)"/>

  <!-- ============ service container ============ -->
  <rect x="300" y="110" width="700" height="620" rx="16" fill="#FCFEFC" stroke="#81C784" stroke-width="1.5"/>
  <text x="320" y="134" class="t">inventory-service  :8082 <tspan class="s" font-weight="400">· WebFlux + R2DBC</tspan></text>

  <rect x="320" y="150" width="660" height="56" rx="8" class="rx"/>
  <text x="650" y="172" class="t c">InventoryController  /api/inventory/**</text>
  <text x="650" y="192" class="xs c">PUT /{sku} (restock) · GET ?skus= · POST /reservations · /{orderId}/release · /{orderId}/confirm</text>

  <text x="320" y="236" class="t">reserve(order) · InventoryService</text>

  <!-- retry wrapper -->
  <rect x="320" y="248" width="660" height="300" rx="12" fill="#FBF7FD" stroke="#7B1FA2" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="336" y="270" class="s" fill="#7B1FA2" font-weight="700">retryWhen(backoff + jitter): every retry starts a BRAND-NEW transaction</text>

  <!-- transaction -->
  <rect x="340" y="282" width="620" height="204" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
  <text x="356" y="304" class="s" fill="#1565C0" font-weight="700">TransactionalOperator: 1 attempt = 1 transaction (BEGIN … COMMIT | ROLLBACK)</text>

  <rect x="356" y="316" width="588" height="38" rx="8" class="chip"/>
  <text x="370" y="340" class="s">① find rows for orderId → already reserved? return them (idempotent replay → 200)</text>

  <rect x="356" y="362" width="588" height="38" rx="8" class="chip"/>
  <text x="370" y="386" class="s">② for each line, SORTED by SKU · concatMap (one connection, one statement at a time)</text>

  <rect x="372" y="410" width="278" height="66" rx="8" class="rx"/>
  <text x="511" y="430" class="t c" font-size="13.5">ATOMIC (default)</text>
  <text x="511" y="448" class="code c">SET available = available - q</text>
  <text x="511" y="465" class="code c">WHERE sku=? AND available &gt;= q</text>

  <rect x="666" y="410" width="278" height="66" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="805" y="430" class="t c" font-size="13.5">OPTIMISTIC</text>
  <text x="805" y="448" class="code c">read → check → save WHERE version=?</text>
  <text x="805" y="465" class="xs c">lost the race → OptimisticLockingFailure</text>

  <text x="340" y="510" class="s">③ any line fails → ROLLBACK every line (all or nothing)</text>
  <text x="340" y="530" class="xs">retried: version conflict, deadlock, same orderId twice · not retried: sold out, unknown SKU</text>

  <!-- release / confirm -->
  <rect x="320" y="566" width="660" height="62" rx="10" class="rx"/>
  <text x="650" y="590" class="t c">release() / confirm()  ·  @Transactional</text>
  <text x="650" y="612" class="s c">guarded UPDATE … WHERE status = 'RESERVED' → calling twice changes nothing (no double refund)</text>

  <rect x="320" y="648" width="320" height="62" rx="10" class="neu"/>
  <text x="480" y="672" class="t c" font-size="13.5">InventorySeeder</text>
  <text x="480" y="692" class="s c">SKU-00001 … 01000 (same SKUs as catalog)</text>
  <rect x="660" y="648" width="320" height="62" rx="10" class="neu"/>
  <text x="820" y="672" class="t c" font-size="13.5">Metric</text>
  <text x="820" y="692" class="code c">inventory.reservation.retries</text>

  <!-- ============ MySQL ============ -->
  <rect x="1090" y="110" width="250" height="70" rx="10" class="neu" stroke-dasharray="5 4"/>
  <text x="1215" y="138" class="t c">Flyway (JDBC)</text>
  <text x="1215" y="160" class="s c">runs V1__…sql once at startup</text>
  <line x1="1215" y1="182" x2="1215" y2="228" stroke="#78909C" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#aGray)"/>

  <path d="M1060,250 A150,20 0 0 1 1360,250 V520 A150,20 0 0 1 1060,520 Z" class="store"/>
  <path d="M1060,250 A150,20 0 0 0 1360,250" class="store" fill="none"/>
  <text x="1210" y="296" class="t c">MySQL 8.4 · inventory_db</text>
  <text x="1210" y="316" class="s c">:3307 (Docker)</text>
  <text x="1210" y="350" class="t c" font-size="13.5">inventory_item</text>
  <text x="1210" y="368" class="s c">sku PK · available · reserved · version</text>
  <text x="1210" y="386" class="s c" fill="#C62828" font-weight="600">CHECK (available &gt;= 0)</text>
  <text x="1210" y="420" class="t c" font-size="13.5">stock_reservation</text>
  <text x="1210" y="438" class="s c">UNIQUE (order_id, sku)</text>
  <text x="1210" y="456" class="s c">RESERVED → CONFIRMED | RELEASED</text>
  <text x="1210" y="492" class="xs c">default isolation: REPEATABLE READ</text>

  <line x1="962" y1="400" x2="1058" y2="400" stroke="#1565C0" stroke-width="2" marker-start="url(#aBlue)" marker-end="url(#aBlue)"/>
  <text x="1030" y="392" class="xs c" fill="#1565C0">R2DBC</text>
  <text x="1030" y="420" class="xs c" fill="#1565C0">pool ≤ 20</text>

  <!-- ============ results ============ -->
  <rect x="40" y="750" width="650" height="230" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/>
  <text x="60" y="778" class="t" fill="#1565C0">Measured: 100 concurrent buyers, 50 units (real MySQL)</text>
  <line x1="60" y1="792" x2="670" y2="792" stroke="#CFD8DC"/>
  <text x="60"  y="812" class="s" font-weight="700">Strategy</text>
  <text x="250" y="812" class="s" font-weight="700">Reserved</text>
  <text x="350" y="812" class="s" font-weight="700">Sold out</text>
  <text x="450" y="812" class="s" font-weight="700">Retries</text>
  <text x="560" y="812" class="s" font-weight="700">Time</text>
  <text x="60"  y="840" class="s">ATOMIC</text>      <text x="250" y="840" class="s">50</text><text x="350" y="840" class="s">50</text><text x="450" y="840" class="s">0</text>    <text x="560" y="840" class="s">0.7–1.6 s</text>
  <text x="60"  y="866" class="s">OPTIMISTIC</text>  <text x="250" y="866" class="s">50</text><text x="350" y="866" class="s">50</text><text x="450" y="866" class="s">560–610</text><text x="560" y="866" class="s">2.3–4.3 s</text>
  <line x1="60" y1="880" x2="670" y2="880" stroke="#CFD8DC"/>
  <text x="60" y="904" class="s">Neither oversells: available + reserved = 50 after every run.</text>
  <text x="60" y="926" class="s">Optimistic pays for contention with retries → ATOMIC is the default for hot items.</text>
  <text x="60" y="948" class="s">100 orders listing {A,B} and {B,A} concurrently: 100/100 reserved, no deadlock.</text>
  <text x="60" y="968" class="xs">ranges over 5 runs · OversellingConcurrencyTest</text>

  <rect x="710" y="750" width="650" height="230" rx="12" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="730" y="778" class="t" fill="#7B1FA2">Three rules for reactive transactions</text>
  <text x="730" y="810" class="s" font-weight="700">1 · Retry OUTSIDE the transaction</text>
  <text x="730" y="830" class="s">REPEATABLE READ keeps the first snapshot; retrying inside</text>
  <text x="730" y="848" class="s">the same transaction re-reads the same stale row forever.</text>
  <text x="730" y="880" class="s" font-weight="700">2 · concatMap, not flatMap, inside a transaction</text>
  <text x="730" y="900" class="s">One transaction = one connection; its statements must run one at a time.</text>
  <text x="730" y="932" class="s" font-weight="700">3 · Lock rows in a fixed order (sort the SKUs)</text>
  <text x="730" y="952" class="s">Every transaction takes locks A → B, so no deadlock cycle can form.</text>
</svg>
