<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" font-family="'Segoe UI', Arial, sans-serif">
  <title>Reactive Order &amp; Delivery Platform - target architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455A64"/>
    </marker>
    <style>
      .t    { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
      .s    { font-size: 12px; fill: #37474F; }
      .c    { text-anchor: middle; }
      .lbl  { font-size: 11px; fill: #455A64; }
      .pill { font-size: 11px; font-weight: 600; text-anchor: middle; }
      .grp  { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #90A4AE; text-anchor: middle; }
      .rx   { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 1.6; }
      .bl   { fill: #FFF3E0; stroke: #EF6C00; stroke-width: 1.6; }
      .br   { fill: #F3E5F5; stroke: #7B1FA2; stroke-width: 1.6; }
      .edge { fill: #E3F2FD; stroke: #1565C0; stroke-width: 1.6; }
      .store{ fill: #ECEFF1; stroke: #546E7A; stroke-width: 1.4; }
      .neu  { fill: #FAFAFA; stroke: #757575; stroke-width: 1.4; }
      .group{ fill: none; stroke: #B0BEC5; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .http { stroke: #455A64; stroke-width: 1.6; fill: none; }
      .evt  { stroke: #455A64; stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; }
      .db   { stroke: #78909C; stroke-width: 1.8; fill: none; stroke-dasharray: 2 4; }
    </style>
  </defs>

  <rect width="1400" height="1100" fill="#FFFFFF"/>

  <!-- ============ Title ============ -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1a1a1a">Reactive Order &amp; Delivery Platform</text>
  <text x="40" y="72" class="s" font-size="14">Target architecture · box colour = execution model · "Phase n" = when it gets built</text>

  <!-- ============ Legend ============ -->
  <rect x="980" y="96" width="380" height="156" rx="10" class="neu"/>
  <text x="1000" y="118" class="t" font-size="13">Legend</text>
  <rect x="1000" y="128" width="26" height="16" rx="3" class="rx"/>   <text x="1034" y="141" class="s">Reactive (WebFlux · Netty)</text>
  <rect x="1000" y="152" width="26" height="16" rx="3" class="bl"/>   <text x="1034" y="165" class="s">Blocking (MVC · Tomcat)</text>
  <rect x="1000" y="176" width="26" height="16" rx="3" class="br"/>   <text x="1034" y="189" class="s">Reactive over blocking DB</text>
  <rect x="1000" y="200" width="26" height="16" rx="3" class="edge"/> <text x="1034" y="213" class="s">Edge / gateway</text>
  <path d="M1000,226 A13,4 0 0 1 1026,226 V238 A13,4 0 0 1 1000,238 Z" class="store"/>
  <path d="M1000,226 A13,4 0 0 0 1026,226" class="store" fill="none"/>
  <text x="1034" y="237" class="s">Data store</text>
  <line x1="1220" y1="136" x2="1262" y2="136" class="http" marker-end="url(#arrow)"/> <text x="1270" y="140" class="s">HTTP call</text>
  <line x1="1220" y1="164" x2="1262" y2="164" class="evt"  marker-end="url(#arrow)"/> <text x="1270" y="168" class="s">Kafka event</text>
  <line x1="1220" y1="192" x2="1262" y2="192" class="db"/>                              <text x="1270" y="196" class="s">DB access</text>

  <!-- ============ Clients ============ -->
  <rect x="560" y="96" width="280" height="56" rx="12" class="neu"/>
  <text x="700" y="119" class="t c">Clients</text>
  <text x="700" y="139" class="s c">Browser · Postman · Mobile</text>
  <line x1="700" y1="152" x2="700" y2="184" class="http" marker-end="url(#arrow)"/>

  <!-- ============ Zipkin ============ -->
  <rect x="120" y="186" width="230" height="76" rx="10" class="neu" stroke-dasharray="5 4"/>
  <text x="235" y="212" class="t c">Zipkin  :9411</text>
  <text x="235" y="232" class="s c">Distributed traces from</text>
  <text x="235" y="250" class="s c">every service</text>
  <rect x="266" y="176" width="72" height="20" rx="10" fill="#fff" stroke="#757575"/><text x="302" y="190" class="pill" fill="#616161">Phase 9</text>

  <!-- ============ API Gateway ============ -->
  <rect x="500" y="186" width="400" height="76" rx="10" class="edge"/>
  <text x="700" y="212" class="t c">API Gateway  :8080</text>
  <text x="700" y="232" class="s c">Spring Cloud Gateway · Netty</text>
  <text x="700" y="250" class="s c">JWT auth · Redis rate limiting · correlation-id</text>
  <rect x="816" y="176" width="72" height="20" rx="10" fill="#fff" stroke="#1565C0"/><text x="852" y="190" class="pill" fill="#1565C0">Phase 8</text>

  <!-- ============ HTTP layer ============ -->
  <rect x="56" y="292" width="1304" height="410" rx="16" class="group"/>
  <text transform="translate(40,497) rotate(-90)" class="grp">HTTP · REQUEST / RESPONSE</text>

  <line x1="700" y1="262" x2="700" y2="318" class="http" marker-end="url(#arrow)"/>
  <text x="712" y="290" class="lbl">routes /api/** to every service</text>

  <!-- Order -->
  <rect x="560" y="320" width="280" height="100" rx="10" class="rx" stroke-width="2.4"/>
  <text x="700" y="346" class="t c">Order Service  :8083</text>
  <text x="700" y="366" class="s c">WebFlux · WebClient · Resilience4j</text>
  <text x="700" y="384" class="s c">202 Accepted + status polling / SSE</text>
  <text x="700" y="402" class="s c">Saga participant (confirm / compensate)</text>
  <rect x="756" y="310" width="72" height="20" rx="10" fill="#fff" stroke="#2E7D32"/><text x="792" y="324" class="pill" fill="#2E7D32">Phase 4–5</text>

  <!-- order_db -->
  <line x1="840" y1="370" x2="900" y2="370" class="db"/>
  <path d="M900,336 A85,10 0 0 1 1070,336 V404 A85,10 0 0 1 900,404 Z" class="store"/>
  <path d="M900,336 A85,10 0 0 0 1070,336" class="store" fill="none"/>
  <text x="985" y="368" class="t c" font-size="14">MySQL  :3307</text>
  <text x="985" y="388" class="s c">order_db · R2DBC</text>

  <!-- WebClient fan-out -->
  <line x1="610" y1="420" x2="170" y2="478" class="http" marker-end="url(#arrow)"/>
  <line x1="650" y1="420" x2="500" y2="478" class="http" marker-end="url(#arrow)"/>
  <line x1="790" y1="420" x2="930" y2="478" class="http" marker-end="url(#arrow)"/>
  <text x="950" y="452" class="lbl">WebClient — Mono.zip (parallel) · flatMap (dependent)</text>

  <!-- Product -->
  <rect x="70" y="480" width="250" height="92" rx="10" class="rx"/>
  <text x="195" y="506" class="t c">Product Service  :8081</text>
  <text x="195" y="526" class="s c">WebFlux · Reactive MongoDB</text>
  <text x="195" y="544" class="s c">NDJSON stream · change-stream SSE</text>
  <rect x="236" y="470" width="72" height="20" rx="10" fill="#fff" stroke="#2E7D32"/><text x="272" y="484" class="pill" fill="#2E7D32">Phase 2</text>

  <!-- Inventory -->
  <rect x="350" y="480" width="250" height="92" rx="10" class="rx"/>
  <text x="475" y="506" class="t c">Inventory Service  :8082</text>
  <text x="475" y="526" class="s c">WebFlux · R2DBC</text>
  <text x="475" y="544" class="s c">reactive tx · optimistic locking</text>
  <rect x="516" y="470" width="72" height="20" rx="10" fill="#fff" stroke="#2E7D32"/><text x="552" y="484" class="pill" fill="#2E7D32">Phase 3</text>

  <!-- Customer -->
  <rect x="830" y="480" width="250" height="92" rx="10" class="br"/>
  <text x="955" y="506" class="t c">Customer Service  :8085</text>
  <text x="955" y="526" class="s c">WebFlux façade over JDBC</text>
  <text x="955" y="544" class="s c">subscribeOn(boundedElastic)</text>
  <rect x="996" y="470" width="72" height="20" rx="10" fill="#fff" stroke="#7B1FA2"/><text x="1032" y="484" class="pill" fill="#7B1FA2">Phase 7</text>

  <!-- Data stores of the HTTP layer -->
  <line x1="195" y1="572" x2="195" y2="602" class="db"/>
  <path d="M110,610 A85,10 0 0 1 280,610 V670 A85,10 0 0 1 110,670 Z" class="store"/>
  <path d="M110,610 A85,10 0 0 0 280,610" class="store" fill="none"/>
  <text x="195" y="640" class="t c" font-size="14">MongoDB  :27017</text>
  <text x="195" y="658" class="s c">replica set rs0 · products</text>

  <line x1="475" y1="572" x2="475" y2="602" class="db"/>
  <path d="M390,610 A85,10 0 0 1 560,610 V670 A85,10 0 0 1 390,670 Z" class="store"/>
  <path d="M390,610 A85,10 0 0 0 560,610" class="store" fill="none"/>
  <text x="475" y="640" class="t c" font-size="14">MySQL  :3307</text>
  <text x="475" y="658" class="s c">inventory_db · R2DBC</text>

  <line x1="955" y1="572" x2="955" y2="602" class="db"/>
  <path d="M870,610 A85,10 0 0 1 1040,610 V670 A85,10 0 0 1 870,670 Z" class="store"/>
  <path d="M870,610 A85,10 0 0 0 1040,610" class="store" fill="none"/>
  <text x="955" y="640" class="t c" font-size="14">IBM Db2  :50000</text>
  <text x="955" y="658" class="s c">CUSTDB · JDBC (blocking)</text>

  <!-- Order <-> Kafka -->
  <line x1="700" y1="422" x2="700" y2="736" class="evt" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="710" y="640" class="lbl">publish orders.* ↓</text>
  <text x="710" y="656" class="lbl">consume payments.* ↑</text>

  <!-- ============ Kafka bus ============ -->
  <rect x="56" y="740" width="1304" height="62" rx="10" fill="#263238"/>
  <text x="700" y="766" class="c" font-size="15" font-weight="700" fill="#FFFFFF">Apache Kafka  :9092  ·  KRaft  ·  3 partitions / topic  ·  key = orderId</text>
  <text x="700" y="788" class="c" font-size="12" fill="#B0BEC5">orders.created · orders.status-changed · payments.completed · payments.failed · each with a .DLT dead-letter topic</text>

  <!-- ============ Event-driven layer ============ -->
  <rect x="56" y="820" width="1304" height="258" rx="16" class="group"/>
  <text transform="translate(40,949) rotate(-90)" class="grp">EVENT-DRIVEN · KAFKA</text>

  <line x1="228" y1="804" x2="228" y2="858" class="evt" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="238" y="838" class="lbl">orders.created ↓   payments.* ↑</text>
  <line x1="548" y1="804" x2="548" y2="858" class="evt" marker-end="url(#arrow)"/>
  <text x="558" y="838" class="lbl">orders.status-changed ↓</text>
  <line x1="868" y1="804" x2="868" y2="858" class="evt" marker-end="url(#arrow)"/>
  <text x="878" y="838" class="lbl">orders.status-changed ↓</text>
  <line x1="1188" y1="804" x2="1188" y2="858" class="evt" marker-end="url(#arrow)"/>
  <text x="1198" y="838" class="lbl">orders.* · payments.* ↓</text>

  <!-- Payment -->
  <rect x="88" y="860" width="280" height="100" rx="10" class="bl"/>
  <text x="228" y="886" class="t c">Payment Service  :8084</text>
  <text x="228" y="906" class="s c">Spring MVC · Tomcat · JPA (blocking)</text>
  <text x="228" y="924" class="s c">@KafkaListener · idempotency key</text>
  <text x="228" y="942" class="s c">@Async / CompletableFuture</text>
  <rect x="284" y="850" width="72" height="20" rx="10" fill="#fff" stroke="#EF6C00"/><text x="320" y="864" class="pill" fill="#EF6C00">Phase 5</text>

  <!-- Notification -->
  <rect x="408" y="860" width="280" height="100" rx="10" class="rx"/>
  <text x="548" y="886" class="t c">Notification Service  :8086</text>
  <text x="548" y="906" class="s c">Reactive Kafka consumer</text>
  <text x="548" y="924" class="s c">backpressure · groupBy(partition)</text>
  <text x="548" y="942" class="s c">Sinks.many().multicast()</text>
  <rect x="604" y="850" width="72" height="20" rx="10" fill="#fff" stroke="#2E7D32"/><text x="640" y="864" class="pill" fill="#2E7D32">Phase 6</text>

  <!-- Tracking -->
  <rect x="728" y="860" width="280" height="100" rx="10" class="rx"/>
  <text x="868" y="886" class="t c">Tracking Service  :8087</text>
  <text x="868" y="906" class="s c">Flux.interval · hot publisher</text>
  <text x="868" y="924" class="s c">share() / replay() fan-out</text>
  <text x="868" y="942" class="s c">reactive Redis pub/sub</text>
  <rect x="924" y="850" width="72" height="20" rx="10" fill="#fff" stroke="#2E7D32"/><text x="960" y="864" class="pill" fill="#2E7D32">Phase 6</text>

  <!-- Order Query (CQRS read model) -->
  <rect x="1048" y="860" width="280" height="100" rx="10" class="rx"/>
  <text x="1188" y="886" class="t c">Order Query Service  :8088</text>
  <text x="1188" y="906" class="s c">CQRS read model · WebFlux</text>
  <text x="1188" y="924" class="s c">event projection → R2DBC Postgres</text>
  <text x="1188" y="942" class="s c">GET /customers/{id}/orders</text>
  <rect x="1244" y="850" width="72" height="20" rx="10" fill="#fff" stroke="#2E7D32"/><text x="1280" y="864" class="pill" fill="#2E7D32">Phase 6</text>

  <!-- payment_db -->
  <line x1="228" y1="960" x2="228" y2="992" class="db"/>
  <path d="M143,1000 A85,10 0 0 1 313,1000 V1056 A85,10 0 0 1 143,1056 Z" class="store"/>
  <path d="M143,1000 A85,10 0 0 0 313,1000" class="store" fill="none"/>
  <text x="228" y="1028" class="t c" font-size="14">MySQL  :3307</text>
  <text x="228" y="1046" class="s c">payment_db · JPA</text>

  <!-- Notification -> browsers -->
  <line x1="548" y1="960" x2="548" y2="994" class="http" marker-end="url(#arrow)"/>
  <rect x="448" y="996" width="200" height="44" rx="22" class="neu"/>
  <text x="548" y="1023" class="s c" font-weight="600">Browsers · WebSocket</text>

  <!-- Tracking -> Redis + browsers -->
  <line x1="800" y1="960" x2="800" y2="992" class="db"/>
  <path d="M720,1000 A80,10 0 0 1 880,1000 V1056 A80,10 0 0 1 720,1056 Z" class="store"/>
  <path d="M720,1000 A80,10 0 0 0 880,1000" class="store" fill="none"/>
  <text x="800" y="1028" class="t c" font-size="14">Redis  :6379</text>
  <text x="800" y="1046" class="s c">pub/sub · rate limit</text>

  <line x1="950" y1="960" x2="968" y2="994" class="http" marker-end="url(#arrow)"/>
  <rect x="898" y="996" width="140" height="44" rx="22" class="neu"/>
  <text x="968" y="1023" class="s c" font-weight="600">Browsers · SSE</text>

  <!-- Order Query -> PostgreSQL -->
  <line x1="1188" y1="960" x2="1188" y2="992" class="db"/>
  <path d="M1098,1000 A90,10 0 0 1 1278,1000 V1056 A90,10 0 0 1 1098,1056 Z" class="store"/>
  <path d="M1098,1000 A90,10 0 0 0 1278,1000" class="store" fill="none"/>
  <text x="1188" y="1028" class="t c" font-size="14">PostgreSQL  :5432</text>
  <text x="1188" y="1046" class="s c">order_query_db · R2DBC</text>
</svg>
